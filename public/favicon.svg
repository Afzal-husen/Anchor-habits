<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Anchor Habits</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00875c"/>
      <stop offset="1" stop-color="#005d3f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Anchor: ring, shank and stock -->
    <g stroke="#fdfaf3">
      <circle cx="256" cy="130" r="38" stroke-width="36"/>
      <path d="M256 192V388M178 230H334" stroke-width="46"/>
    </g>
    <!-- The anchor's arms are a check mark: one more session logged -->
    <path d="M150 316L256 400L384 250" stroke="#efa831" stroke-width="50"/>
  </g>
</svg>
